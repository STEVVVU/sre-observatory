apiVersion: batch/v1
kind: Job
metadata:
  name: sre-observatory-drill-load
  labels:
    app.kubernetes.io/name: sre-observatory-load-generator
    app.kubernetes.io/part-of: sre-observatory
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sre-observatory-load-generator
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: load-generator
          image: sre-observatory:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "/opt/observatory/tools/loadgen.py"]
          args:
            - --url
            - http://sre-observatory/work
            - --rps
            - "20"
            - --duration
            - "180"
            - --timeout
            - "2"
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true

